<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>ASSOCORALSA</title>
   <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
   <style>
       * {
           margin: 0;
           padding: 0;
           box-sizing: border-box;
       }

       @keyframes gradientBG {
           0% { background-position: 0% 50%; }
           50% { background-position: 100% 50%; }
           100% { background-position: 0% 50%; }
       }

       body {
           font-family: 'Poppins', sans-serif;
           background: linear-gradient(135deg, #f5f7fa 0%, #ffffff 50%, #f5f7fa 100%);
           background-size: 200% 200%;
           animation: gradientBG 15s ease infinite;
           min-height: 100vh;
           display: flex;
           align-items: center;
           justify-content: center;
       }

       .container {
           padding: 1.5rem;
           width: 100%;
           max-width: 450px;
           perspective: 1000px;
       }

       .card {
           background: white;
           border-radius: 16px;
           padding: 2.5rem;
           box-shadow: 0 10px 30px rgba(0,0,0,0.1);
           border-top: 4px solid #FFB800;
           transform-origin: center;
           animation: cardEnter 0.8s cubic-bezier(0.4, 0, 0.2, 1);
           transition: transform 0.3s ease, box-shadow 0.3s ease;
       }

       .card:hover {
           transform: translateY(-5px) rotateX(2deg);
           box-shadow: 0 15px 35px rgba(0,0,0,0.15);
       }

       @keyframes cardEnter {
           0% {
               opacity: 0;
               transform: translateY(50px) rotateX(-10deg);
           }
           100% {
               opacity: 1;
               transform: translateY(0) rotateX(0);
           }
       }

       .header {
           text-align: center;
           margin-bottom: 2.5rem;
           position: relative;
           padding: 1rem 0;
       }

       .header::before,
       .header::after {
           content: '';
           position: absolute;
           left: 50%;
           transform: translateX(-50%);
           width: 120px;
           height: 3px;
           background: linear-gradient(to right, transparent, #FFB800, transparent);
           transition: width 0.3s ease;
       }

       .card:hover .header::before,
       .card:hover .header::after {
           width: 150px;
       }

       .header::before { top: 0; }
       .header::after { bottom: 0; }

       h1 {
           font-size: 3rem;
           margin-bottom: 0.5rem;
           line-height: 1.2;
       }

       h1 span {
           display: inline-block;
           animation: letterFloat 0.5s ease-out backwards;
       }

       @keyframes letterFloat {
           0% {
               opacity: 0;
               transform: translateY(20px) rotate(-5deg);
           }
           100% {
               opacity: 1;
               transform: translateY(0) rotate(0);
           }
       }

       .text-gray { color: #4A5568; }
       .text-yellow { 
           color: #FFB800;
           animation: shine 3s infinite;
       }

       @keyframes shine {
           0% { filter: brightness(100%); }
           50% { filter: brightness(130%); }
           100% { filter: brightness(100%); }
       }

       .slogan {
           color: #718096;
           font-style: italic;
           font-size: 1.1rem;
           opacity: 0;
           animation: fadeInSlogan 0.8s ease-out 0.5s forwards;
           transform-origin: center;
       }

       @keyframes fadeInSlogan {
           from {
               opacity: 0;
               transform: translateY(10px) scale(0.95);
           }
           to {
               opacity: 1;
               transform: translateY(0) scale(1);
           }
       }

       .tasa-card {
           background: linear-gradient(135deg, #FFB800, #FFA500);
           padding: 2rem;
           border-radius: 12px;
           color: white;
           margin-bottom: 2.5rem;
           transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
           position: relative;
           overflow: hidden;
       }

       .tasa-card:hover {
           transform: scale(1.02) translateY(-5px);
           box-shadow: 0 15px 25px rgba(255,184,0,0.3);
       }

       .tasa-card::after {
           content: '';
           position: absolute;
           top: -50%;
           left: -50%;
           width: 200%;
           height: 200%;
           background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
           opacity: 0;
           transform: scale(0.5);
           transition: transform 0.6s ease, opacity 0.6s ease;
       }

       .tasa-card:hover::after {
           opacity: 1;
           transform: scale(1);
       }

       .switch-container {
           display: flex;
           justify-content: center;
           align-items: center;
           gap: 20px;
           position: relative;
           padding: 10px 0;
       }

       .switch {
           position: relative;
           width: 280px;
           height: 45px;
           background: linear-gradient(145deg, #e6e9ef, #ffffff);
           border-radius: 25px;
           padding: 3px;
           transition: all 0.3s ease;
           cursor: pointer;
           display: flex;
           align-items: center;
           box-shadow: 3px 3px 6px #d1d9e6, -3px -3px 6px #ffffff;
           border: 1px solid rgba(255, 255, 255, 0.4);
       }

       .switch-handle {
           position: absolute;
           top: 3px;
           left: 3px;
           width: calc(50% - 6px);
           height: calc(100% - 6px);
           background: linear-gradient(145deg, #3b82f6, #2563eb);
           border-radius: 22px;
           transition: all 0.3s ease;
           box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
           z-index: 1;
       }

       .switch-handle::after {
           content: '';
           position: absolute;
           top: 0;
           left: 0;
           right: 0;
           bottom: 0;
           border-radius: 22px;
           background: linear-gradient(145deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.03));
           opacity: 0.8;
       }

       .switch.active .switch-handle {
           left: calc(50% + 3px);
           background: linear-gradient(145deg, #3b82f6, #2563eb);
       }

       .switch-option {
           position: relative;
           width: 50%;
           text-align: center;
           font-size: 0.95rem;
           color: #64748b;
           font-weight: 500;
           transition: all 0.3s ease;
           user-select: none;
           z-index: 2;
           padding: 8px 0;
       }

       .switch-option.active {
           color: white;
           text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
       }

       .switch:hover .switch-handle {
           background: linear-gradient(145deg, #4287f6, #2b6bed);
           box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.15);
       }

       .switch-container {
           display: flex;
           justify-content: center;
           margin: 20px 0;
       }

       .switch:hover .switch-handle {
           transform: scale(1.02);
           box-shadow: 0 4px 12px rgba(255,184,0,0.2);
       }

       .codigo-section {
           animation: slideUpFade 0.5s cubic-bezier(0.4, 0, 0.2, 1);
       }

       @keyframes slideUpFade {
           from {
               opacity: 0;
               transform: translateY(20px) scale(0.98);
           }
           to {
               opacity: 1;
               transform: translateY(0) scale(1);
           }
       }

       input {
           width: 100%;
           padding: 1rem;
           border: 2px solid #E2E8F0;
           border-radius: 8px;
           font-size: 1.1rem;
           transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
           background: #F7FAFC;
       }

       input:focus {
           outline: none;
           border-color: #FFB800;
           box-shadow: 0 0 0 3px rgba(255,184,0,0.2);
           background: white;
           transform: scale(1.01);
       }

       .btn-continuar {
           width: 100%;
           height: 60px;
           background: linear-gradient(135deg, #FFB800, #FFA500);
           color: white;
           border: none;
           border-radius: 10px;
           font-weight: bold;
           font-size: 1.2rem;
           cursor: pointer;
           position: relative;
           overflow: hidden;
           display: flex;
           align-items: center;
           justify-content: center;
           gap: 10px;
           transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
       }

       .btn-continuar:hover {
           transform: translateY(-3px) scale(1.02);
           box-shadow: 0 12px 25px rgba(255,184,0,0.4);
       }

       .btn-continuar::after {
           content: '';
           position: absolute;
           top: -50%;
           left: -50%;
           width: 200%;
           height: 200%;
           background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
           opacity: 0;
           transform: scale(0.5);
           transition: transform 0.6s ease, opacity 0.6s ease;
       }

       .btn-continuar:hover::after {
           opacity: 1;
           transform: scale(1);
       }

       .arrow-right {
           transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
       }

       .btn-continuar:hover .arrow-right {
           transform: translateX(8px);
       }

       @media (max-width: 480px) {
           .container { padding: 1rem; }
           .card { padding: 1.5rem; }
           h1 { font-size: 2.2rem; }
           .button-group { grid-template-columns: 1fr; }
       }
   </style>
</head>
<body>
   <!-- Rest of the HTML remains the same -->
   <div id="app">
       <div class="container">
           <div class="card">
               <div class="header">
                   <h1>
                       <span class="text-gray">A</span>
                       <span class="text-yellow">SSO</span>
                       <span class="text-gray">CORALSA</span>
                   </h1>
                   <p class="slogan">"Tu solución financiera confiable"</p>
               </div>

               <div class="tasa-card">
                   <div class="tasa-content">
                       <div class="percent-icon">%</div>
                       <div>
                           <p style="font-size: 1.4rem; font-weight: bold;">
                               Tasa preferencial: {{ isSocio ? '12%' : '13%' }} anual
                           </p>
                           <p style="margin-top: 0.5rem;">
                               {{ isSocio ? '¡Beneficio exclusivo para socios!' : '¡Hazte socio y obtén una mejor tasa!' }}
                           </p>
                       </div>
                   </div>
               </div>

               <div class="socio-selection">
                   <h2>¿Es usted socio?</h2>
                   <div class="switch-container">
                       <div 
                           class="switch"
                           :class="{ active: isSocio }"
                           @click="selectSocio(!isSocio)"
                       >
                           <div class="switch-handle"></div>
                           <div class="switch-option" :class="{ active: !isSocio }">No soy socio</div>
                           <div class="switch-option" :class="{ active: isSocio }">Sí, soy socio</div>
                       </div>
                   </div>
               </div>

               <div v-if="isSocio" class="codigo-section">
                   <label style="display: block; margin-bottom: 0.8rem; color: #4A5568; font-weight: 500;">
                       Ingrese su código de socio
                   </label>
                   <input 
                       v-model="codigo"
                       :class="{ error: codigoError }"
                       placeholder="Ej: 1234"
                       type="text"
                   >
                   <p v-if="codigoError" style="color: #DC2626; font-size: 0.9rem; margin-top: 0.5rem;">
                       {{ codigoError }}
                   </p>
               </div>

               <button class="btn-continuar" @click="continuar">
                   <span>Continuar al cotizador</span>
                   <span class="arrow-right">→</span>
               </button>
           </div>
       </div>
   </div>

   <script>
       const { createApp } = Vue

       createApp({
           data() {
               return {
                   isSocio: false,
                   codigo: '',
                   codigoError: ''
               }
           },
           methods: {
               selectSocio(value) {
                   this.isSocio = value;
                   if (!value) {
                       this.codigo = '';
                       this.codigoError = '';
                   }
               },
               continuar() {
                   if (this.isSocio && this.codigo.length < 4) {
                       this.codigoError = 'El código debe tener al menos 4 caracteres';
                       return;
                   }
                this.codigoError = '';
                // Navegar al archivo cotizador.html
                window.location.href = 'cotizador.html';
           }
}
       }).mount('#app')
   </script>
</body>
</html>
