<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba PDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div id="testContent" style="padding: 20px; background: #f0f0f0;">
        <h1>Prueba de PDF</h1>
        <p>Este es un contenido simple para probar html2pdf.js.</p>
    </div>
    <button onclick="generateTestPDF()">Generar PDF</button>

    <script>
        function generateTestPDF() {
            const element = document.getElementById('testContent');
            const opt = {
                margin: 10,
                filename: 'prueba.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().from(element).set(opt).save();
        }
    </script>
</body>
</html>
